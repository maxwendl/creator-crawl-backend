steps:
  # Build and deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/run'
    args:
      - deploy
      - creator-crawl-backend
      - '--source=.'
      - '--platform=managed'
      - '--region=europe-west1'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'
